name: build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Configure native bridge
        run: cmake -S . -B build/native -G "Visual Studio 17 2022" -A x64

      - name: Build native bridge
        run: cmake --build build/native --config Release --parallel

      - name: Run native tests
        run: ctest --test-dir build/native -C Release --output-on-failure

      - name: Restore managed projects
        run: dotnet restore PdbLens.sln

      - name: Build managed projects
        run: dotnet build PdbLens.sln -c Release --no-restore

      - name: Run managed tests
        run: dotnet test tests/PdbLens.Core.Tests/PdbLens.Core.Tests.csproj -c Release --no-build --no-restore

      - name: Publish portable build
        run: dotnet publish src/PdbLens.App/PdbLens.App.csproj -c Release -r win-x64 --self-contained true --no-restore -o artifacts/PdbLens

      - name: Create portable archive
        shell: pwsh
        run: Compress-Archive -Path artifacts/PdbLens/* -DestinationPath artifacts/PdbLens-win-x64.zip -Force

      - name: Build unsigned MSIX
        run: >-
          dotnet build src/PdbLens.App/PdbLens.App.csproj
          -c Release -p:Platform=x64 -p:PdbLensPackaged=true
          -p:GenerateAppxPackageOnBuild=true -p:AppxPackageSigningEnabled=false
          --no-restore

      - name: Upload portable build
        uses: actions/upload-artifact@v4
        with:
          name: PdbLens-win-x64
          path: artifacts/PdbLens-win-x64.zip

      - name: Upload MSIX
        uses: actions/upload-artifact@v4
        with:
          name: PdbLens-msix-unsigned
          path: src/PdbLens.App/AppPackages/**/*.msix
